<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+DW+Pica:ital@0;1&family=Sorts+Mill+Goudy:ital@0;1&display=swap">
<style>
/* Layout: the phone R4 test (D-154, D-159) as the game itself, not a framed picture of a phone: a
   candlelit chrome band at the top (guild, date, chest, the test's question bar), the screen in the
   middle on clean paper for data (STYLE §1), four tabs at the bottom (Hall, March, Desk, Ask; D-149).
   One deliberate look: the hall is always lamp-lit, so the page commits to one dark chrome theme. */
:root {
  --desk: #3b2a1e; --desk2: #2c1f16; --desk3: #4a3626;
  --paper: #efe4cc; --paper2: #e5d7b9; --paper3: #f6eedb; --ink: #2a2017; --ink2: #6b5a45; --rule: #d6c6a5;
  --seal: #8e2a22; --brass: #b8923e; --brass2: #d7b66a;
  --good: #3f6f8f; --warn: #c08a1e; --bad: #8e2a22;
  --chrome: #f1e6cf; --chrome2: #c8b48f; --sky: #c9d3d8; --wall: #e3dcc8; --cellar: #d8cbad; --alert: #f5e3d6;
  --title: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --letter: "IM Fell DW Pica", Georgia, serif;
  --ledger: "Sorts Mill Goudy", "Goudy Old Style", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--desk2); color: var(--chrome); font-family: var(--ledger); font-size: 16px; line-height: 1.4; font-variant-numeric: lining-nums; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--desk2); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 3px solid var(--brass2); outline-offset: 2px; }
.app { max-width: 480px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); box-shadow: 0 0 40px rgba(0,0,0,.5); }
.gut { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
@media (min-width: 481px) { .gut { padding-left: 16px; padding-right: 16px; } }
h1, h2, h3 { font-family: var(--title); font-weight: 400; margin: 0; text-wrap: balance; }
p { margin: 0; }

/* Chrome band */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--desk2); color: var(--chrome); border-bottom: 2px solid var(--brass); }
.bar { display: flex; align-items: baseline; gap: 10px; padding-block: 8px; }
.bar .g { font-family: var(--title); color: var(--brass2); font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar .d { margin-left: auto; white-space: nowrap; color: var(--chrome2); font-size: 15px; font-variant-numeric: lining-nums tabular-nums; }
.pull { background: var(--desk); color: var(--chrome2); text-align: center; font-size: 15px; padding-block: 4px 6px; }
.pull b { font-family: var(--title); font-weight: 400; color: var(--brass2); font-size: 15px; }
.quiz { background: var(--desk3); border-top: 1px solid #5c4532; padding-block: 10px; display: grid; gap: 8px; }
.quiz[hidden] { display: none; }
.quiz .h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; color: var(--brass2); font-size: 15px; letter-spacing: .04em; font-variant-numeric: lining-nums tabular-nums; }
.quiz .q { font-size: 18px; color: var(--paper); line-height: 1.3; }
.quiz .clock { font-family: var(--ledger); letter-spacing: 0; font-variant-numeric: lining-nums tabular-nums; color: var(--chrome2); font-size: 15px; }
.quiz .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.quiz .opts { display: grid; gap: 6px; }
.quiz .ans { color: var(--brass2); }
.btn { min-height: 44px; padding: 8px 16px; border-radius: 4px; background: var(--brass); color: var(--desk2); font-size: 17px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--brass2); border: 1.5px solid var(--brass); }
.btn.opt { background: var(--paper3); color: var(--ink); font-family: var(--ledger); font-size: 16px; text-align: left; font-variant-numeric: lining-nums tabular-nums; }
.quiz .min { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* Screen */
main { flex: 1; padding-block: 12px 96px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.screen-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.screen-h h2 { font-size: 22px; color: var(--seal); }
.back { min-height: 44px; display: inline-flex; align-items: center; color: var(--seal); font-family: var(--title); font-size: 15px; }
.muted { color: var(--ink2); }
.note { color: var(--ink2); font-size: 15px; }
.sub { color: var(--ink2); font-size: 15px; }
.neg { color: var(--bad); }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; min-width: 0; }

/* The hall hub (D-149): a cutaway of the guildhall, one system per room */
.hall { background: linear-gradient(var(--sky), var(--wall) 22%); border: 2px solid var(--ink); border-top: 0; display: grid; }
.roof { display: block; width: 100%; height: 54px; }
.floor { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-top: 2px solid var(--ink); }
.room { min-height: 74px; padding: 6px 8px; border-right: 2px solid var(--ink); display: flex; flex-direction: column; justify-content: space-between; gap: 4px; position: relative; min-width: 0; }
.room:last-child { border-right: 0; }
.room .n { font-family: var(--title); font-size: 15px; line-height: 1.1; }
.room .s { font-size: 15px; color: var(--ink2); line-height: 1.2; }
.room.alert { background: var(--alert); } .room.alert .n { color: var(--seal); }
.room.cellar { background: var(--cellar); }
.room.desk { background: #f3e2b8; } .room.desk .n { color: var(--seal); }
.room.off .n, .room.off .s { opacity: .55; }
.room .badge { position: absolute; top: 5px; right: 6px; background: var(--seal); color: var(--paper); font-size: 15px; border-radius: 9px; padding: 0 7px; font-variant-numeric: lining-nums tabular-nums; }
.ground { height: 10px; background: #8a7a5c; }
.roomhead { display: grid; gap: 4px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.roomhead h2 { font-size: 24px; }
.staff { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; color: var(--ink2); background: var(--paper2); border-radius: 3px; padding: 6px 10px; }

/* Ledgers */
table.led { border-collapse: collapse; width: 100%; font-variant-numeric: lining-nums tabular-nums; font-size: 15px; }
table.led th { text-align: left; font-weight: 400; color: var(--ink2); font-size: 15px; border-bottom: 1.5px solid var(--ink); padding: 4px 8px 4px 0; white-space: nowrap; }
table.led th button { min-height: 44px; color: var(--ink2); }
table.led th button.on { color: var(--seal); }
table.led td { border-bottom: 1px solid var(--rule); padding: 6px 8px 6px 0; white-space: nowrap; vertical-align: top; }
table.led .r { text-align: right; }
table.led td.wrap { white-space: normal; }
table.led tr.total td { border-top: 1.5px solid var(--ink); font-weight: 600; }
table.led .who { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; min-height: 44px; }
.sticky1 th:first-child, .sticky1 td:first-child { position: sticky; left: 0; background: var(--paper); z-index: 1; }
.list { display: grid; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 9px; border-bottom: 1px solid var(--rule); min-height: 48px; width: 100%; }
.li .l { display: grid; min-width: 0; }
.li .l b { font-weight: 400; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .l span { font-size: 15px; color: var(--ink2); }
.li .rt { text-align: right; white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; }
.pill { display: inline-block; font-size: 15px; padding: 0 8px; border-radius: 9px; color: var(--paper); white-space: nowrap; }
.pill.fit { background: var(--good); } .pill.away { background: var(--warn); color: var(--ink); } .pill.out { background: var(--bad); } .pill.dead { background: var(--ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 44px; padding: 4px 12px; border: 1.5px solid var(--ink2); border-radius: 18px; font-size: 15px; color: var(--ink2); background: var(--paper); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.subtabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 2px solid var(--ink); }
.subtabs button { min-height: 44px; text-align: center; font-family: var(--title); font-size: 15px; color: var(--ink2); position: relative; }
.subtabs button.on { color: var(--seal); box-shadow: inset 0 -3px 0 var(--seal); }
.subtabs button[data-n]::after { content: attr(data-n); position: absolute; top: 4px; right: 4px; background: var(--seal); color: var(--paper); font-family: var(--ledger); font-size: 15px; border-radius: 8px; padding: 0 5px; }
.offer { display: grid; gap: 2px; padding-block: 10px; border-bottom: 1px solid var(--rule); }
.offer .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.offer .t b { font-family: var(--title); font-weight: 400; font-size: 17px; min-width: 0; }
.offer .fee { white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; font-size: 16px; }
.danger-routine { color: var(--good); } .danger-hazardous { color: #8a6210; } .danger-perilous { color: var(--bad); } .danger-deadly { color: var(--ink); font-weight: 600; }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat div { background: var(--paper2); border-radius: 3px; padding: 8px; display: grid; }
.stat b { font-weight: 600; font-size: 18px; font-variant-numeric: lining-nums tabular-nums; }
.stat span { font-size: 15px; color: var(--ink2); }
.notice { display: flex; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--rule); align-items: flex-start; width: 100%; }
.wax { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--title); color: var(--paper); font-size: 15px; background: radial-gradient(circle at 40% 35%, #a8392f, var(--seal) 60%, #6d1f19); }
.wax.blue { background: radial-gradient(circle at 40% 35%, #5a87a6, var(--good) 60%, #2b4d63); }
.wax.brass { background: radial-gradient(circle at 40% 35%, #d7b66a, var(--brass) 60%, #87692a); color: var(--ink); }
.notice .w { display: grid; gap: 2px; min-width: 0; flex: 1; }
.notice .w b { font-weight: 400; font-family: var(--title); font-size: 16px; }
.notice .go { color: var(--seal); font-size: 15px; white-space: nowrap; }
.letter { font-family: var(--letter); font-size: 16px; display: grid; gap: 6px; background: var(--paper3); border: 1px solid var(--rule); padding: 12px 14px; border-radius: 3px; }
canvas.map { width: 100%; height: auto; border: 1.5px solid var(--ink); border-radius: 3px; display: block; }

/* Ask the clerk */
.chat { display: grid; gap: 10px; }
.bub { max-width: 92%; background: var(--paper2); border-radius: 4px 12px 12px 12px; padding: 8px 12px; font-size: 16px; font-variant-numeric: lining-nums; display: grid; gap: 6px; }
.bub .whoc { font-family: var(--title); font-size: 15px; color: var(--ink2); letter-spacing: .05em; }
.bub.me { justify-self: end; background: var(--ink); color: var(--paper); border-radius: 12px 4px 12px 12px; font-family: var(--ledger); }
.bub table.led { font-family: var(--ledger); }
.askform { display: flex; gap: 8px; }
.askform input { flex: 1; min-width: 0; min-height: 44px; font: inherit; font-family: var(--letter); padding: 6px 14px; border: 1.5px solid var(--ink); border-radius: 22px; background: var(--paper3); color: var(--ink); }
.find { display: grid; gap: 8px; }
.find input, .filter input { width: 100%; min-height: 44px; font: inherit; padding: 6px 14px; border: 1.5px solid var(--ink); border-radius: 22px; background: var(--paper3); color: var(--ink); }
.find .out { background: var(--paper2); border-radius: 4px; padding: 8px 12px; display: grid; gap: 6px; font-variant-numeric: lining-nums; }
.find .out:empty { display: none; }
.find input, .filter input, .askform input { color-scheme: light; }
.linkbtn { color: var(--seal); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; font-family: var(--ledger); }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center; background: var(--desk2); border-top: 2px solid var(--brass); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .in { width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { min-height: 56px; display: grid; place-items: center; align-content: center; gap: 0; color: var(--chrome2); font-family: var(--title); font-size: 15px; letter-spacing: .04em; }
.tabs button i { font-style: normal; font-size: 18px; line-height: 1; }
.tabs button.on { color: var(--brass2); box-shadow: inset 0 3px 0 var(--brass2); }

/* Person card */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(20,14,9,.6); display: flex; align-items: flex-end; justify-content: center; }
.card { width: 100%; max-width: 480px; max-height: 88%; overflow-y: auto; background: var(--paper); color: var(--ink); border-radius: 12px 12px 0 0; padding-block: 14px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
.card .ch { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card h2 { font-size: 24px; }
.card h3 { font-size: 16px; color: var(--seal); border-bottom: 1px solid var(--rule); }
.attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font-variant-numeric: lining-nums tabular-nums; }
.attrs div { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--rule); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font-variant-numeric: lining-nums tabular-nums; }

/* Intro and results */
.intro { display: grid; gap: 12px; }
.intro h1 { font-size: 28px; color: var(--seal); }
.intro .box { background: var(--paper2); border-radius: 4px; padding: 12px 14px; display: grid; gap: 8px; }
.intro ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.intro .score { font-size: 20px; font-variant-numeric: lining-nums; }
.res td.pass { color: var(--good); } .res td.fail { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

const MAP_TINT = { 'temperate-forest': '#c2d2a4', taiga: '#becfb0', swamp: '#b2c8b2', grassland: '#e6e5c4', steppe: '#e8e0be', tundra: '#e6e4d6', alpine: '#d8d2c6' };
function marchScreen() {

  <canvas class="map" id="map" width="900" height="${Math.round(900 * DATA.map.h / DATA.map.w)}" role="img" aria-label="Map of the March with the guild hall and the sites where parties are"></canvas>
  <div class="list">${[...DATA.parties].sort((a, b) => a.homeDay - b.homeDay).map((p) => `<div class="li"><span class="l"><b>${esc(cap(p.site))}</b><span>${esc(p.monster)} · ${esc(p.members.join(', '))}</span></span><span class="rt">home<br>${wk(p.homeDay)}</span></div>`).join('') || '<p class="note">No party is out.</p>'}</div>
  <p class="note">Pinch and pan come with the phone engine test (D-154); this map is a still.</p>`;
}
function drawMap() {
  const c = $('map'); if (!c) return;
  const screenPx = (n) => Math.ceil(n * c.width / Math.max(1, c.clientWidth)); // canvas px for n px on screen
  const g = c.getContext('2d'); const M = DATA.map; const k = c.width / M.w;
  const P = (x, y) => [(x + 0.5) * k, (y + 0.5) * k];
  for (let y = 0; y < M.h; y += 1) for (let x = 0; x < M.w; x += 1) {
    const ch = M.grid[y * M.w + x];
    g.fillStyle = ch === '~' ? '#c9d4d0' : MAP_TINT[M.biomes[ch.charCodeAt(0) - 97]] || '#f0e7d0';
    g.fillRect(x * k, y * k, k + 0.5, k + 0.5);
  }
  const path = (pts, style, w, dash = []) => { g.beginPath(); pts.forEach(([x, y], i) => { const [px, py] = P(x, y); i ? g.lineTo(px, py) : g.moveTo(px, py); }); g.strokeStyle = style; g.lineWidth = w; g.setLineDash(dash); g.stroke(); g.setLineDash([]); };
  for (const r of M.rivers) path(r, 'rgba(70,100,110,.75)', 2);
  for (const r of M.roads) path(r, 'rgba(58,44,30,.55)', 2, [6, 4]);
  const label = (text, x, y, font, color = '#3a2c1e', dy = -10) => { const [px, py] = P(x, y); g.font = font; g.fillStyle = color; g.textAlign = 'center'; const half = g.measureText(text).width / 2 + 4; g.fillText(text, Math.min(c.width - half, Math.max(half, px)), Math.max(18, py + dy)); };
  for (const t of M.towns) { const [px, py] = P(t.x, t.y); g.fillStyle = '#3a2c1e'; g.beginPath(); g.arc(px, py, 5, 0, Math.PI * 2); g.fill(); label(t.name, t.x, t.y, `italic ${screenPx(15)}px "Sorts Mill Goudy", Georgia, serif`); }
  for (const p of DATA.parties) { const s = M.sites.find((x) => x.name === p.site); if (!s) continue; path([[M.hall.x, M.hall.y], [s.x, s.y]], '#8e2a22', 2.5, [8, 5]); const [sx, sy] = P(s.x, s.y); g.fillStyle = '#8e2a22'; g.beginPath(); g.arc(sx, sy, 9, 0, Math.PI * 2); g.fill(); label(cap(s.name), s.x, s.y, `${screenPx(16)}px "IM Fell English SC", Georgia, serif`, '#8e2a22', -16); }
  const [hx, hy] = P(M.hall.x, M.hall.y);
  g.fillStyle = '#8e2a22'; g.fillRect(hx - 8, hy - 8, 16, 16); g.strokeStyle = '#d7b66a'; g.lineWidth = 3; g.strokeRect(hx - 8, hy - 8, 16, 16);
  label(M.hall.name, M.hall.x, M.hall.y, `${screenPx(17)}px "IM Fell English SC", Georgia, serif`, '#8e2a22', 30);
}

/* Ask the clerk: plain questions answered from the guild's own records (templates, no AI; GAME-03). */
const SUGGEST = ['Who is hurt?', 'Who is away?', 'Best-paying contract', 'Wages in week 10', 'Chest at the end of week 8'];
function askScreen() {
  return `<div class="screen-h"><h2>Ask the clerk</h2><span class="sub">Names, weeks, money, contracts</span></div>
  <div class="chat" id="chat">${chat.length ? chat.map((b) => `<div class="bub ${b.me ? 'me' : ''}">${b.me ? '' : '<span class="whoc">The clerk</span>'}${b.html}</div>`).join('') : '<div class="bub"><span class="whoc">The clerk</span><span>Ask me about anyone by name, a week’s money, the chest, the contracts, who is hurt or who is away.</span></div>'}</div>
  <div class="chips">${SUGGEST.map((s) => `<button type="button" class="chip" data-suggest="${esc(s)}">${esc(s)}</button>`).join('')}</div>
  <form class="askform" id="askform"><input id="askq" aria-label="Ask the clerk" autocomplete="off" enterkeyhint="send" placeholder="Ask the clerk…"><button type="submit" class="btn">Ask</button></form>`;
}
const STOP = new Set(['the', 'who', 'what', 'where', 'when', 'how', 'which', 'week', 'weeks', 'wage', 'wages', 'fee', 'fees', 'chest', 'best', 'pays', 'paid', 'money', 'gold', 'hurt', 'away', 'dead', 'died', 'home', 'and', 'for', 'now', 'are', 'was', 'end', 'loot', 'grant', 'upkeep', 'contract', 'contracts', 'board', 'party', 'parties']);
const norm = (s) => s.toLowerCase().replace(/[^a-z0-9' ]/g, ' ');
function answer(q) {
  const t = norm(q);
  const words = t.split(/\s+/).filter(Boolean);
  const num = (t.match(/\b(\d{1,2})\b/) || [])[1];
  const week = num ? DATA.weeks.find((w) => w.week === Number(num)) : null;
  const asked = words.filter((x) => x.length > 2 && !STOP.has(x));
  const people = DATA.roster.filter((p) => { const parts = norm(p.name).split(' '); return t.includes(norm(p.name)) || parts.some((x) => asked.some((w) => x.startsWith(w))); });
  const exact = people.filter((p) => t.includes(norm(p.name)));
  if (people.length) {
    return (exact.length ? exact : people).slice(0, 4).map((p) => `<div><b>${esc(p.name)}</b>, ${esc(p.class.toLowerCase())}, ${p.position} line. ${esc(statusText(p))}.${p.status.kind === 'dead' ? '' : ` Paid ${money(p.wageCopper)} a week.`} ${p.quests} quests, ${p.won} won. <button type="button" class="linkbtn" data-person="${p.id}">Open the card</button></div>`).join('');
  }
  const has = (...ks) => ks.some((k) => words.some((w) => w === k || (k.length > 4 && w.startsWith(k))));
  if (has('hurt', 'injured', 'injury', 'injuries', 'infirmary', 'recovering', 'recover', 'wound', 'wounded')) {
    const out = living().filter((p) => p.status.kind === 'out').sort((a, b) => a.status.day - b.status.day);
    return out.length ? `<div>${out.length} recovering:</div>${out.map((p) => `<div>${who(p)}, fit ${wk(p.status.day)}.</div>`).join('')}` : '<div>Nobody is recovering.</div>';
  }
  if (has('away', 'party', 'parties', 'home')) {
    return DATA.parties.length ? [...DATA.parties].sort((a, b) => a.homeDay - b.homeDay).map((p) => `<div>At ${esc(cap(p.site))}: ${esc(p.members.join(', '))}. Home ${wk(p.homeDay)}.</div>`).join('') : '<div>No party is out.</div>';
  }
  if (has('dead', 'died', 'death', 'heroes', 'lost')) {
    const dead = DATA.roster.filter((p) => p.status.kind === 'dead');
    return dead.length ? dead.map((p) => `<div>${who(p)} died ${wk(p.status.day)}, at ${esc(cap(p.status.where))}.</div>`).join('') : '<div>No one has died this year.</div>';
  }
  const site = DATA.board.filter((o) => t.includes(norm(o.site)) || norm(o.site).split(' ').some((x) => x.length > 3 && words.includes(x)));
  if (site.length) return site.map((o) => `<div>${esc(cap(o.site))}: ${esc(o.monster)}, ${o.danger}, pays ${money(o.feeCopper)}, ${o.travelDays} days each way, gone after week ${o.expiresWeek}.</div>`).join('');
  if (has('contract', 'board', 'best', 'pays', 'most')) {
    const top = [...DATA.board].sort((a, b) => b.feeCopper - a.feeCopper).slice(0, 3);
    return top.length ? `<div>The best-paying on the board:</div>${top.map((o) => `<div>${esc(cap(o.site))} (${esc(o.monster)}, ${o.danger}): ${money(o.feeCopper)}.</div>`).join('')}<button type="button" class="linkbtn" data-desk="contracts">Open the board</button>` : '<div>The board is empty.</div>';
  }
  const line = LINES.find(([k, n]) => has(k, n.toLowerCase(), k === 'fee' ? 'earn' : '~', k === 'fee' ? 'income' : '~'));
  if (line && week) return `<div>${line[1]} in week ${week.week}: ${weekLine(week, line[0]) ? money(Math.abs(weekLine(week, line[0]))) + (weekLine(week, line[0]) < 0 ? ' paid out' : ' taken in') : 'none'}.</div>`;
  if (line && line[0] === 'wages') return `<div>The wage bill is ${money(weekBill())} a week for ${living().length} people. Name a week for what was paid then.</div>`;
  if (has('chest', 'gold', 'money', 'coin', 'treasury')) {
    if (week) return `<div>The chest at the end of week ${week.week}: ${money(week.chest)}.</div>`;
    return `<div>The chest holds ${money(DATA.chest.copper)} now. Name a week to see it then.</div>`;
  }
  return `<div>Nothing found for “${esc(q.trim())}”. Try a name, a week with wages, fees or chest, a site, contracts, hurt or away.</div>`;
}
function ask(q) {
  if (!q.trim()) return;
  chat.push({ me: true, html: esc(q) });
  chat.push({ me: false, html: answer(q) });
  if (quiz && quiz.phase === 'ask') quiz.asks.push(q);
  render();
  const last = $('chat')?.lastElementChild; last?.scrollIntoView({ block: 'nearest' });
}

    <h3>Attributes</h3>
    <div class="attrs">${ATTRS.map((a) => `<div><span>${cap(a)}</span><b>${p.attributes[a]}</b></div>`).join('')}</div>
    ${hist.length ? `<h3>Last contracts</h3><div class="scroll"><table class="led"><thead><tr><th class="r">Week</th><th>Site</th><th>Outcome</th></tr></thead><tbody>${hist.map((h) => `<tr><td class="r">${h.week}</td><td>${esc(cap(h.site))}</td><td>${outcome[h.outcome]}${h.injured ? ', injured' : ''}</td></tr>`).join('')}</tbody></table></div>` : ''}
  </div></div>`;
}
let cardFrom = null;
function renderCard() {
  const p = personId && DATA.roster.find((x) => x.id === personId);
  if (p && !cardFrom) cardFrom = document.activeElement;
  if (!p && cardFrom) { const back = cardFrom; cardFrom = null; if (document.contains(back)) back.focus(); }
  $('sheet').innerHTML = p ? personCard(p) : '';
  if (p) { $('card').focus(); logView(`card/${p.id}`); }
}

/* The fact test (D-159): 5 facts, hidden until Start. Read, start timing, find, tap Found it, then pick the answer. */
let quiz = null;
let lookedFirst = false;
let runsHere = 0;
try { runsHere = Number(localStorage.getItem(`r4-runs-${ROUND}`)) || 0; } catch { /* no storage: count from zero */ }
function pickDistinct(right, pool, n = 3) {
  const out = [];
  for (const x of pool) if (x !== right && !out.includes(x)) { out.push(x); if (out.length === n) break; }
  return out;
}
// Near misses for a money answer, used when the ledger has too few other values (every week's wages can be equal).
const nearMoney = (copper) => [copper + 140, copper - 90, copper + 260, copper - 230, copper + 55].filter((c) => c > 0).map(money);
function shuffled(arr, seed) { const a = [...arr]; let s = seed; for (let i = a.length - 1; i > 0; i -= 1) { s = (s * 1103515245 + 12345) % 2147483648; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function questions() {
  // A name two people share would make the question ambiguous, so only unique names are asked about.
  const unique = (name) => DATA.roster.filter((x) => x.name === name).length === 1;
  const L = living().filter((p) => unique(p.name)).sort(byName);
  const qs = [];
  const p1 = L[Math.floor(L.length * 0.6)];
  const wages = [...new Set(L.map((p) => money(p.wageCopper)))];
  qs.push({ q: `What is ${p1.name}'s weekly wage?`, a: money(p1.wageCopper), pool: [...wages, ...nearMoney(p1.wageCopper)] });
  const hurt = L.filter((p) => p.status.kind === 'out');
  if (hurt.length) {
    const h = hurt[Math.floor(hurt.length / 2)];
    const d = h.status.day;
    qs.push({ q: `${h.name} is recovering. When are they fit again?`, a: wk(d), pool: [d + 1, d - 1, d + 7, d - 7, d + 2].filter((x) => x > 0).map(wk) });
  }
  const w = DATA.weeks[13];
  const wagesBy = DATA.weeks.map((x) => money(-weekLine(x, 'wages')));
  qs.push({ q: `How much did the guild pay in wages in week ${w.week}?`, a: money(-weekLine(w, 'wages')), pool: [...wagesBy.slice(9, 13), ...wagesBy.slice(14, 18), ...nearMoney(-weekLine(w, 'wages'))] });
  const board = [...DATA.board].sort((a, b) => b.feeCopper - a.feeCopper);
  const label = (o) => `${cap(o.site)}, ${money(o.feeCopper)}`;
  if (board.length > 1 && board[0].feeCopper !== board[1].feeCopper) qs.push({ q: 'Which contract on the board pays the most?', a: label(board[0]), pool: board.slice(1).map(label) });
  const party = DATA.parties[0];
  if (party && party.members.some(unique)) {
    const member = [...party.members].reverse().find(unique);
    const sites = [...new Set([...DATA.parties.map((p) => cap(p.site)), ...DATA.board.map((o) => cap(o.site))])];
    qs.push({ q: `Where is ${member} now?`, a: `Away at ${cap(party.site)}`, pool: ['At the hall, fit', 'In the infirmary', ...sites.map((s) => `Away at ${s}`)] });
  }
  const spares = [
    () => { const x = DATA.weeks[9]; return { q: `How much was in the chest at the end of week ${x.week}?`, a: money(x.chest), pool: [...DATA.weeks.slice(5, 15).map((y) => money(y.chest)), ...nearMoney(Math.abs(x.chest))] }; },
    () => { const dead = DATA.roster.find((p) => p.status.kind === 'dead' && unique(p.name)); return dead ? { q: `Where did ${dead.name} die?`, a: cap(dead.status.where), pool: DATA.board.map((o) => cap(o.site)) } : null; },
  ];
  for (const s of spares) if (qs.length < 5) { const x = s(); if (x) qs.push(x); }
  return qs.filter((x) => pickDistinct(x.a, x.pool).length === 3).slice(0, 5).map((x, i) => {
    const wrong = pickDistinct(x.a, x.pool);
    return { q: x.q, a: x.a, options: shuffled([x.a, ...wrong], 7 + i * 31) };
  });
}
function screenSize() { return `${window.innerWidth} × ${window.innerHeight} px at ${window.devicePixelRatio || 1}×`; }
function quizRender() {
  const box = $('quiz');
  const reading = Boolean(quiz) && quiz.phase !== 'ask';
  $('screen').inert = reading; document.querySelector('.tabs').inert = reading;
  if (!quiz) { box.hidden = true; return; }
  box.hidden = false;
  const cur = quiz.qs[quiz.at];
  const n = `Fact ${quiz.at + 1} of ${quiz.qs.length}`;
  if (quiz.phase === 'read') {
    box.innerHTML = `<div class="h"><span>${n}</span><span>The clock starts when you tap</span></div><p class="q" aria-live="polite">${esc(cur.q)}</p><div class="row"><button type="button" class="btn" id="quiz-go">Start timing</button></div>`;
  } else if (quiz.phase === 'ask') {
    box.innerHTML = `<div class="min"><div class="h" style="flex:1"><span>${n}</span><span class="clock" id="quiz-clock" aria-hidden="true">0.0 s</span></div></div><p class="q">${esc(cur.q)}</p><div class="row"><button type="button" class="btn" id="quiz-found">Found it</button><span class="clock">Find it below, then tap.</span></div>`;
  } else {
    box.innerHTML = `<div class="h"><span>${n}</span><span class="clock">${quiz.last.toFixed(1)} s</span></div><p class="q">${esc(cur.q)}</p><div class="opts">${cur.options.map((o, i) => `<button type="button" class="btn opt" data-opt="${i}">${esc(o)}</button>`).join('')}</div>`;
  }
}
function quizStart() {
  quiz = { qs: questions(), at: 0, phase: 'read', started: 0, last: 0, results: [], path: [], asks: [] };
  view = { tab: 'hall', room: null, desk: 'notices' };
  personId = null; chat.length = 0; findQ = ''; nameQ = '';
  renderCard(); render(); quizRender();
  window.scrollTo(0, 0);
}
function logView(name) { if (quiz && quiz.phase === 'ask' && quiz.path[quiz.path.length - 1] !== name) quiz.path.push(name); }
function quizFound() { quiz.last = (performance.now() - quiz.started) / 1000; quiz.phase = 'pick'; quizRender(); }
function quizPick(i) {
  const cur = quiz.qs[quiz.at];
  const chosen = cur.options[i];
  quiz.results.push({ q: cur.q, answer: cur.a, chosen, ok: chosen === cur.a, s: Math.round(quiz.last * 10) / 10, path: quiz.path, asks: quiz.asks });
  quiz.at += 1; quiz.phase = 'read'; quiz.path = []; quiz.asks = [];
  if (quiz.at >= quiz.qs.length) { finish(); return; }
  view = { tab: 'hall', room: null, desk: 'notices' }; personId = null; findQ = ''; nameQ = ''; renderCard(); render(); quizRender(); window.scrollTo(0, 0);
}
async function finish() {
  const results = quiz.results;
  const passed = results.filter((r) => r.ok && r.s < 10).length;
  runsHere += 1; try { localStorage.setItem(`r4-runs-${ROUND}`, String(runsHere)); } catch { /* ignore */ }
  const run = { round: ROUND, attempt: runsHere, seed: DATA.seed, screen: screenSize(), userAgent: navigator.userAgent.slice(0, 160), lookedFirst, passed, of: results.length, at: new Date().toISOString(), results };
  const summary = `Phone R4 round ${ROUND}, seed ${DATA.seed}, ${run.screen}: ${passed} of ${results.length} under 10 s and right. ` + results.map((r, i) => `F${i + 1} ${r.s.toFixed(1)} s ${r.ok ? 'right' : 'wrong'} via ${r.path.join(' > ') || 'start screen'}`).join('; ') + '.';
  quiz = null; quizRender();
  view = { tab: 'result', room: null, desk: 'notices' }; render();
  $('screen').innerHTML = resultScreen(results, passed, summary, 'Saving the results…');
  let saved = 'Results could not be saved here. Copy them and paste them into the chat.';
  try {
    const db = await window.claude?.use?.('db');
    if (db) { await db.collection('r4runs').add(run); saved = 'Saved. Claude can read these results; nothing to paste.'; }
  } catch { /* keep the copy fallback */ }
  const s = $('save-state'); if (s) s.textContent = saved;
}
function resultScreen(results, passed, summary, state) {
  return `<div class="intro"><h1>Fact test done</h1><p class="score">${passed} of ${results.length} found in under 10 seconds and right</p>
  <div class="scroll"><table class="led res"><thead><tr><th>Fact</th><th class="r">Time</th><th>Result</th></tr></thead><tbody>${results.map((r, i) => `<tr><td class="wrap">${i + 1}. ${esc(r.q)}<br><span class="muted">${esc(r.answer)}${r.ok ? '' : `; you picked ${esc(r.chosen)}`}</span></td><td class="r">${r.s.toFixed(1)} s</td><td class="${r.ok && r.s < 10 ? 'pass' : 'fail'}">${r.ok ? (r.s < 10 ? 'pass' : 'right, slow') : 'wrong'}</td></tr>`).join('')}</tbody></table></div>
  <p id="save-state" class="note">${esc(state)}</p>
  <div class="row" style="display:flex; gap:8px; flex-wrap:wrap"><button type="button" class="btn" id="copy">Copy results</button><button type="button" class="btn ghost" id="again">Back to the intro</button></div>
  <textarea id="summary" readonly rows="5" style="width:100%; font:inherit; font-size:15px; background:var(--paper3); color:var(--ink); border:1px solid var(--rule); padding:8px">${esc(summary)}</textarea></div>`;
}
function introScreen() {
  return `<div class="intro"><h1>Guildhall fact test</h1>
  <p><b>Round 2</b> (D-162): names run A to Z with a filter, the work desk has a Money page, and a Find box on the hall and the desk answers as you type.</p>
  <p>R4 on the phone (D-154). The pass line: you find 5 facts in under 10 seconds each, using the hall, the work desk and Ask the clerk.</p>
  <div class="box"><ol>
    <li>Tap <b>Start the test</b>. A question appears at the top; read it, then tap <b>Start timing</b>.</li>
    <li>Find the fact anywhere: a room in the hall, the work desk, the Find box at their top, or Ask the clerk. Tap <b>Found it</b> as soon as you see it.</li>
    <li>Pick the answer you found. The clock stopped at Found it.</li>
  </ol></div>
  <p class="note">The guild is new to you: ${living().length} adventurers, played by the engine to week ${DATA.week} (seed ${esc(DATA.seed)}). The facts are hidden until you start. Results save to this page for Claude to read.</p>
  ${runsHere ? `<p class="note"><b>You have run round ${ROUND} on this phone before.</b> The facts repeat, so a new run counts as practice, not as the test.</p>` : ''}
  <p class="note">Your screen: <span id="size">${screenSize()}</span>.</p>
  <div style="display:flex; gap:8px; flex-wrap:wrap"><button type="button" class="btn" id="start">Start the test</button><button type="button" class="btn ghost" id="look">Look around first</button></div></div>`;
}

/* Render */
const TABS = [['hall', '⌂', 'Hall'], ['march', '✦', 'March'], ['desk', '✎', 'Desk'], ['ask', '?', 'Ask']];
function render() {
  const d = DATA.chest ? `Week ${DATA.week}, day ${DATA.dayOfWeek} · ${money(DATA.chest.copper)}` : '';
  $('date').textContent = d;
  $('guild').textContent = DATA.map?.hall?.name ? `${DATA.map.hall.name} guild` : 'The guild';
  $('tabs').innerHTML = TABS.map(([k, i, n]) => `<button type="button" class="${view.tab === k ? 'on' : ''}" data-tab="${k}" aria-current="${view.tab === k ? 'page' : 'false'}"><i aria-hidden="true">${i}</i>${n}</button>`).join('');
  const s = $('screen');
  if (view.tab === 'intro') s.innerHTML = introScreen();
  else if (view.tab === 'result') return;
  else if (view.tab === 'hall') s.innerHTML = view.room ? roomScreen(view.room) : hallScreen();
  else if (view.tab === 'desk') s.innerHTML = deskScreen();
  else if (view.tab === 'march') { s.innerHTML = marchScreen(); drawMap(); }
  else s.innerHTML = askScreen();
  logView(viewName());
}
function go(next) { view = { ...view, ...next }; nameQ = ''; findQ = ''; render(); window.scrollTo(0, 0); }

document.addEventListener('click', (e) => {
  if (e.target.id === 'scrim') { personId = null; renderCard(); return; }
  const t = e.target.closest('button');
  if (!t) return;
  const ds = t.dataset;
  if (t.id === 'start') quizStart();
  else if (t.id === 'look') { lookedFirst = true; go({ tab: 'hall', room: null }); }
  else if (t.id === 'again') go({ tab: 'intro', room: null, desk: 'notices' });
  else if (t.id === 'copy') { const ta = $('summary'); navigator.clipboard?.writeText(ta.value).then(() => { t.textContent = 'Copied'; }, () => { ta.select(); }); }
  else if (t.id === 'quiz-go') { view = { tab: 'hall', room: null, desk: 'notices' }; personId = null; findQ = ''; nameQ = ''; renderCard(); quiz.phase = 'ask'; quiz.path = []; render(); window.scrollTo(0, 0); quiz.started = performance.now(); quizRender(); }
  else if (t.id === 'quiz-found') quizFound();
  else if (ds.opt !== undefined) quizPick(Number(ds.opt));
  else if (t.id === 'card-close') { personId = null; renderCard(); }
  else if (ds.person) { personId = ds.person; renderCard(); }
  else if (ds.tab) { if (view.tab === 'intro' && !quiz) lookedFirst = true; go({ tab: ds.tab, room: null }); }
  else if (ds.room) { if (ds.room === 'desk') go({ tab: 'desk', desk: 'notices' }); else go({ room: ds.room }); }
  else if (ds.roomGo) go({ tab: 'hall', room: ds.roomGo });
  else if (ds.go) go({ tab: ds.go, room: null });
  else if (ds.desk) go({ tab: 'desk', desk: ds.desk });
  else if (ds.bsort) { bsort = ds.bsort; render(); }
  else if (ds.rfilter) { rfilter = ds.rfilter; render(); }
  else if (ds.rsort) { const k = ds.rsort; rsort = rsort.key === k ? { key: k, dir: -rsort.dir } : { key: k, dir: k === 'wage' || k === 'quests' ? -1 : 1 }; render(); }
  else if (ds.suggest) ask(ds.suggest);
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'findq') { findQ = e.target.value; const out = $('findout'); if (out) out.innerHTML = findQ.trim().length > 1 ? answer(findQ) : ''; }
  else if (e.target.id === 'nameq') { nameQ = e.target.value.toLowerCase().trim(); for (const row of document.querySelectorAll('#people [data-name]')) row.hidden = Boolean(nameQ) && !row.dataset.name.includes(nameQ); }
});
document.addEventListener('change', (e) => { if (quiz && quiz.phase === 'ask' && (e.target.id === 'findq' || e.target.id === 'nameq') && e.target.value.trim()) quiz.asks.push(`${e.target.id === 'findq' ? 'find' : 'filter'}: ${e.target.value.trim()}`); });
document.addEventListener('submit', (e) => { if (e.target.id !== 'askform') return; e.preventDefault(); const q = $('askq').value; ask(q); const i = $('askq'); if (i) i.focus(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && personId) { personId = null; renderCard(); } });
setInterval(() => { const c = $('quiz-clock'); if (c && quiz && quiz.phase === 'ask') c.textContent = `${((performance.now() - quiz.started) / 1000).toFixed(1)} s`; }, 100);
window.addEventListener('resize', () => { const el = $('size'); if (el) el.textContent = screenSize(); });
view = { tab: 'intro', room: null, desk: 'notices' };
render();
</script>
