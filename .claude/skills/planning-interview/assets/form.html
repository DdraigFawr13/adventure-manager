<title>%%TITLE%%</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<!--
  planning-interview form template. Copy it, fill CONFIG at the bottom, publish with the Artifact tool
  and capabilities {"db": {}, "user": {}}. Answers save to the artifact database collection CONFIG.round
  as one document per answer id: { v: <value>, at: <ms> }. Read them back with ArtifactData "list".
  Restyle the tokens in :root to suit the project; keep the layout and the save code.
-->
<style>
/* Layout: one narrow phone column; sticky progress header, section tabs, one card per question. */
:root {
  --bg: #e9ece6; --surface: #f7f8f4; --ink: #1f2a2a; --muted: #5b6763; --line: #cfd5cc;
  --accent: #2f6b5e; --accent-ink: #ffffff; --brass: #9a6b1f; --chip: #e1e6dd;
  --now: #2f6b5e; --soon: #3d6a96; --later: #7a6a52; --no: #8a8f8b; --bad: #a8452f; --warn: #9a6b1f;
  --display: "Alegreya SC", Georgia, serif; --body: "Alegreya Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141b1c; --surface: #1c2526; --ink: #e3e8e2; --muted: #9aa6a1; --line: #2f3b3c;
  --accent: #6cb8a4; --accent-ink: #0f1617; --brass: #d6a75a; --chip: #253031;
  --now: #6cb8a4; --soon: #7fa8d6; --later: #bba57f; --no: #7d8582; --bad: #e07f66; --warn: #d6a75a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141b1c; --surface: #1c2526; --ink: #e3e8e2; --muted: #9aa6a1; --line: #2f3b3c;
  --accent: #6cb8a4; --accent-ink: #0f1617; --brass: #d6a75a; --chip: #253031;
  --now: #6cb8a4; --soon: #7fa8d6; --later: #bba57f; --no: #7d8582; --bad: #e07f66; --warn: #d6a75a; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hrow { max-width: 680px; margin: 0 auto; display: flex; align-items: baseline; gap: 12px; }
.hrow h1 { font-family: var(--display); font-size: 1.15rem; margin: 0; letter-spacing: .03em; flex: 1; }
.meter { max-width: 680px; margin: 8px auto 0; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
#count, #save { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
main { max-width: 680px; margin: 0 auto; padding-block: 16px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
nav.tabs button { flex: none; font: 500 .85rem var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
nav.tabs button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
h2 { font-family: var(--display); font-size: 1.3rem; margin: 10px 0 0; text-wrap: balance; letter-spacing: .02em; }
.sub { color: var(--muted); margin: -6px 0 0; font-size: .92rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card.done { border-left: 4px solid var(--accent); }
.card p { margin: 0; } .card ul, .card ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.card h3 { margin: 0; font-size: 1.04rem; text-wrap: balance; }
.why { color: var(--muted); font-size: .9rem; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { font: 500 .92rem var(--body); text-align: left; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 8px; padding: 9px 12px; cursor: pointer; min-height: 44px; }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.rec { margin-left: 6px; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--brass); font-weight: 700; }
.opt[aria-pressed="true"] .rec { color: inherit; }
.grid4, .grid3 { display: grid; gap: 6px; } .grid4 { grid-template-columns: repeat(4, 1fr); } .grid3 { grid-template-columns: repeat(3, 1fr); }
.seg { font: 500 .86rem var(--body); min-height: 42px; border-radius: 6px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
.seg[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg[aria-pressed="true"][data-v="soon"] { background: var(--soon); border-color: var(--soon); }
.seg[aria-pressed="true"][data-v="later"], .seg[aria-pressed="true"][data-v="discuss"], .seg[aria-pressed="true"][data-v="after"] { background: var(--later); border-color: var(--later); }
.seg[aria-pressed="true"][data-v="no"] { background: var(--no); border-color: var(--no); }
.seg[aria-pressed="true"][data-v="disagree"], .seg[aria-pressed="true"][data-v="cut"] { background: var(--bad); border-color: var(--bad); }
.row { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; padding-top: 0; }
.row .name { font-weight: 700; } .row .desc { color: var(--muted); font-size: .88rem; }
.tag { font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--brass); font-weight: 700; margin-left: 6px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: .7rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; border: 1px solid currentColor; color: var(--muted); }
.pill.high { color: var(--bad); } .pill.medium { color: var(--warn); }
.take { background: var(--chip); border-radius: 6px; padding: 10px 12px; font-size: .95rem; }
.take b { color: var(--brass); }
textarea { width: 100%; box-sizing: border-box; min-height: 56px; font: .95rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; resize: vertical; }
textarea.qnote { min-height: 40px; font-size: .9rem; }
.row textarea.qnote { min-height: 36px; margin-top: 2px; }
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { font: 700 .95rem var(--body); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 12px 18px; cursor: pointer; min-height: 44px; }
.note { font-size: .85rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
</style>

<header>
  <div class="hrow"><h1 id="heading"></h1><span id="count">0 / 0</span></div>
  <div class="meter"><i id="bar"></i></div>
  <div class="hrow" style="margin-top:4px"><span id="save">Loading…</span></div>
</header>
<main>
  <section class="card" id="intro"></section>
  <nav class="tabs" id="tabs"></nav>
  <div id="content" style="display:grid;gap:14px"></div>
  <div class="foot"><button class="btn" id="next" type="button">Next section</button><span class="note" id="where"></span></div>
</main>

<script>
/* ===== CONFIG: the only part to edit =====
  round:   database collection and storage key, e.g. "round1", "review1", "final".
  heading: header text. intro: trusted HTML strings shown first (recap, how to answer, what to say when done).
  sections[]: { id, title, sub, notes (default true), items[] }. Every single, multi, priority and keep item gets its own
  notes box, saved as "note_<id>"; set note: false on an item to drop it. Section notes save as "n_<section id>",
  reply comments as "c_<id>". Item types:
    single   { id, q, why?, opts: ["a", { t: "b", rec: 1 }] }        one choice; rec marks your recommendation
    multi    { id, q, why?, opts }                                     any number
    text     { id, q, why? }                                           free text (not counted in progress)
    priority { id, name, desc?, tag? }                                 Now / Soon / Later / No
    keep     { id, name, desc?, tag? }                                 Keep / After / Cut
    reply    { id, title, body, take, sev?: "high"|"medium"|"low", src? }   Agree / Disagree / Discuss + comment
    info     { html, onRender?(el) }                                   trusted HTML: recaps, plans, wireframes; onRender may draw on a canvas
*/
const CONFIG = %%CONFIG%%;

const state = {}; let db = null, active = 0;
const KEY = "pi-" + CONFIG.round;
const $ = s => document.querySelector(s);
function el(tag, attrs = {}, ...kids) { const e = document.createElement(tag); for (const k in attrs) { if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]); else if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } kids.flat().forEach(k => k != null && e.append(k)); return e; }
const answered = v => Array.isArray(v) ? v.length > 0 : !!v;
const counted = it => ["single", "multi", "priority", "keep", "reply"].includes(it.type);
function progress() {
  const ks = CONFIG.sections.flatMap(s => s.items.filter(counted).map(i => i.id));
  const n = ks.filter(k => answered(state[k])).length;
  $("#count").textContent = n + " / " + ks.length; $("#bar").style.width = (ks.length ? 100 * n / ks.length : 0) + "%";
}
const timers = {};
function put(key, value) {
  state[key] = value; progress();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  if (!db) { $("#save").textContent = "Saved on this device only"; return; }
  clearTimeout(timers[key]); $("#save").textContent = "Saving…";
  timers[key] = setTimeout(async () => {
    try { await db.collection(CONFIG.round).doc(key).set({ v: value, at: Date.now() }); $("#save").textContent = "Saved"; }
    catch (e) { $("#save").textContent = "Couldn't save (" + (e && e.code || "error") + "). Kept on this device."; }
  }, 500);
}
function textBox(key, label, ph, cls, rows) { const ta = el("textarea", { id: key, "aria-label": label, placeholder: ph || "" }); if (cls) ta.className = cls; if (rows) ta.rows = rows; ta.value = state[key] || ""; ta.addEventListener("input", () => put(key, ta.value)); return ta; }
function chips(it) {
  return el("div", { class: "opts" }, ...it.opts.map(o => { const t = typeof o === "string" ? o : o.t;
    const on = it.type === "multi" ? (state[it.id] || []).includes(t) : state[it.id] === t;
    return el("button", { class: "opt", type: "button", "aria-pressed": on ? "true" : "false", onclick: () => {
      if (it.type === "multi") { const c = new Set(state[it.id] || []); c.has(t) ? c.delete(t) : c.add(t); put(it.id, [...c]); } else put(it.id, state[it.id] === t ? "" : t);
      render(); } }, t, o.rec ? el("span", { class: "rec" }, "recommended") : null); }));
}
function seg(id, cls, values, label) {
  return el("div", { class: cls }, ...values.map(([v, txt]) => el("button", { class: "seg", type: "button", "data-v": v, "aria-pressed": state[id] === v ? "true" : "false", "aria-label": label + ": " + txt, onclick: () => { put(id, state[id] === v ? "" : v); render(); } }, txt)));
}
/* Per-question notes: write thoughts down while answering instead of saving them for the end. */
const noteBox = (it, label, small) => it.note === false ? null : textBox("note_" + it.id, "Notes on " + label, small ? "Note (optional)" : "Notes (optional): thoughts, doubts, reasons", "qnote", small ? 1 : 2);
const SETS = { priority: [["now", "Now"], ["soon", "Soon"], ["later", "Later"], ["no", "No"]], keep: [["keep", "Keep"], ["after", "After"], ["cut", "Cut"]] };
function renderItems(items) {
  const out = []; let group = null;
  for (const it of items) {
    if (it.type === "priority" || it.type === "keep") {
      if (!group || group.dataset.type !== it.type) {
        group = el("section", { class: "card", "data-type": it.type });
        if (it.type === "priority") group.append(el("p", { class: "why" }, "Now = first usable version. Soon = right after. Later = someday. No = drop it."));
        out.push(group);
      }
      group.append(el("div", { class: "row" }, el("div", {}, el("span", { class: "name" }, it.name), it.tag ? el("span", { class: "tag" }, it.tag) : null), it.desc ? el("div", { class: "desc" }, it.desc) : null, seg(it.id, it.type === "priority" ? "grid4" : "grid3", SETS[it.type], it.name), noteBox(it, it.name, true)));
      continue;
    }
    group = null;
    if (it.type === "info") { const c = el("section", { class: "card" }); c.innerHTML = it.html; out.push(c); if (it.onRender) requestAnimationFrame(() => it.onRender(c)); continue; }
    if (it.type === "reply") {
      out.push(el("section", { class: "card" + (answered(state[it.id]) ? " done" : "") },
        el("div", { class: "pills" }, it.sev ? el("span", { class: "pill " + it.sev }, it.sev) : null, it.src ? el("span", { class: "pill" }, it.src) : null),
        el("h3", {}, it.title), it.body ? el("p", {}, it.body) : null, it.take ? el("div", { class: "take" }, el("b", {}, "My take: "), it.take) : null,
        seg(it.id, "grid3", [["agree", "Agree"], ["disagree", "Disagree"], ["discuss", "Discuss"]], it.title), textBox("c_" + it.id, "Comment on " + it.title, "Comment (optional)")));
      continue;
    }
    const card = el("section", { class: "card" + (answered(state[it.id]) ? " done" : "") }, el("h3", {}, it.q), it.why ? el("p", { class: "why" }, it.why) : null);
    card.append(...(it.type === "text" ? [textBox(it.id, it.q)] : [chips(it), noteBox(it, it.q)].filter(Boolean))); out.push(card);
  }
  return out;
}
function render() {
  const s = CONFIG.sections[active], y = window.scrollY;
  const notes = s.notes === false ? null : el("section", { class: "card" }, el("h3", {}, "Notes on " + s.title.toLowerCase()), el("p", { class: "why" }, "Optional. Anything the options missed."), textBox("n_" + s.id, "Notes on " + s.title));
  $("#content").replaceChildren(...[el("h2", {}, s.title), s.sub ? el("p", { class: "sub" }, s.sub) : null, ...renderItems(s.items), notes].filter(Boolean));
  $("#tabs").replaceChildren(...CONFIG.sections.map((x, i) => el("button", { type: "button", "aria-current": i === active ? "true" : "false", onclick: () => go(i) }, x.title)));
  $("#tabs").hidden = CONFIG.sections.length < 2;
  $("#next").hidden = active === CONFIG.sections.length - 1;
  $("#where").textContent = CONFIG.sections.length > 1 ? "Section " + (active + 1) + " of " + CONFIG.sections.length : "";
  progress(); window.scrollTo(0, y);
}
function go(i) { active = i; render(); window.scrollTo(0, 0); try { localStorage.setItem(KEY + "-tab", i); } catch (e) {} }
$("#next").addEventListener("click", () => go(Math.min(active + 1, CONFIG.sections.length - 1)));
$("#heading").textContent = CONFIG.heading;
$("#intro").innerHTML = CONFIG.intro.map(p => "<p>" + p + "</p>").join("");

try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); active = Math.min(+localStorage.getItem(KEY + "-tab") || 0, CONFIG.sections.length - 1); } catch (e) {}
render(); $("#save").textContent = "Connecting…";
(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { $("#save").textContent = "Saved on this device only. Open while signed in to share answers with Claude."; return; }
  try {
    const snap = await db.collection(CONFIG.round).get(); const local = { ...state };
    snap.docs.forEach(d => { const v = d.data(); if (v && "v" in v) state[d.id] = v.v; });
    for (const k in local) if (answered(local[k]) && !answered(state[k])) put(k, local[k]);
    $("#save").textContent = "Synced with Claude"; render();
  } catch (e) { $("#save").textContent = "Couldn't load saved answers (" + (e && e.code || "error") + ")"; }
})();
</script>
